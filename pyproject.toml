[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-assistant"
version = "0.3.0"
description = "Local-first Qwen chat, hybrid RAG, and transactional coding assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openai>=3,<4"]

[project.optional-dependencies]
rag = [
  "faiss-cpu>=1.12,<2",
  "numpy>=2,<3",
  "pdf2image>=1.17,<2",
  "pillow>=11,<13",
  "pypdf>=6,<7",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.2,<2",
  "rank-bm25>=0.2.2,<1",
  "sentence-transformers>=5,<7",
]
ui = ["streamlit>=1.50,<2"]
coding-agent = [
  "faiss-cpu>=1.12,<2",
  "numpy>=2,<3",
  "rank-bm25>=0.2.2,<1",
  "sentence-transformers>=5,<7",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
local-ai-chat = "local_ai_assistant.llm.client:main"
local-ai-code-rag = "local_ai_assistant.code_index.repository:main"
local-ai-code-agent = "local_ai_assistant.agent.code_agent:main"
local-ai-ui = "local_ai_assistant.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["F403", "F401"]
"local_llm.py" = ["F403", "F401"]
"rag.py" = ["F403", "F401"]
"code_rag.py" = ["F403", "F401"]
"code_agent.py" = ["F403", "F401"]
"ui/streamlit/app.py" = ["F403", "F401"]
"tests/integration/test_demo_app.py" = ["E402"]
