[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-assistant"
version = "0.8.0"
description = "Local-first Qwen chat, hybrid RAG, and transactional coding assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openai>=3,<4"]

[project.optional-dependencies]
rag = [
  "faiss-cpu>=1.12,<2",
  "numpy>=2,<3",
  "pdf2image>=1.17,<2",
  "pillow>=11,<13",
  "pypdf>=6,<7",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.2,<2",
  "rank-bm25>=0.2.2,<1",
  "sentence-transformers>=5,<7",
]
coding-agent = [
  "faiss-cpu>=1.12,<2",
  "numpy>=2,<3",
  "rank-bm25>=0.2.2,<1",
  "sentence-transformers>=5,<7",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-rust>=0.24.2,<0.25",
  "tree-sitter-solidity>=1.2.13,<2",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
  "tree-sitter-sql>=0.3.11,<0.4",
  "tree-sitter-c>=0.24.2,<0.25",
  "tree-sitter-cpp>=0.23.4,<0.24",
  "tree-sitter-java>=0.23.5,<0.24",
  "tree-sitter-bash>=0.25.1,<0.26",
]
gateway = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
local-ai-chat = "local_ai_assistant.llm.client:main"
local-ai-code-rag = "local_ai_assistant.code_index.repository:main"
local-ai-code-agent = "local_ai_assistant.agent.code_agent:main"
local-ai-plan = "local_ai_assistant.planning.cli:main"
local-ai-execute = "local_ai_assistant.execution.cli:main"
local-ai-validate = "local_ai_assistant.validation.cli:main"
local-ai-history = "local_ai_assistant.history.cli:main"
local-ai-isolation = "local_ai_assistant.isolation.cli:main"
local-ai-gateway = "local_ai_assistant.gateway.cli:main"
local-ai-presentation = "local_ai_assistant.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"local_llm.py" = ["F403", "F401"]
"rag.py" = ["F403", "F401"]
"code_rag.py" = ["F403", "F401"]
"code_agent.py" = ["F403", "F401"]
"tests/integration/test_demo_app.py" = ["E402"]
